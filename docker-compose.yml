services:
  postgres:
    image: postgres:15-alpine
    container_name: smart-energy-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_energy}
      POSTGRES_USER: ${POSTGRES_USER:-energy_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-energy_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-energy_user} -d ${POSTGRES_DB:-smart_energy}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-energy-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-smart_energy}
      POSTGRES_USER: ${POSTGRES_USER:-energy_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-energy_pass}
      MODEL_PATH: /app/models/best_model.joblib
      FLASK_ENV: production
      LOG_LEVEL: INFO
    ports:
      - "${FLASK_PORT:-5000}:5000"
    volumes:
      - ./data/gold:/app/data/gold
      - ./models:/app/models
      - ./logs:/app/logs

volumes:
  postgres_data:
